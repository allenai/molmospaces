name: Unit Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-unittests:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.11]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglew-dev libosmesa6-dev

      - name: Set MuJoCo rendering backend
        if: runner.os == 'Linux'
        run: echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual env
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install MolmoSpaces
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco,g1_humanoid,torch-cpu]

      - name: Run datagen test for franka-droid pick task
        run: |
          source .venv/bin/activate
          pytest molmo_spaces/tests/test_datagen_franka_pick.py

      - name: Run datagen test for franka-droid pick-and-place task
        run: |
          source .venv/bin/activate
          pytest molmo_spaces/tests/test_datagen_franka_pick_and_place.py
