name: Core CI/CD checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # main_public mirrors allenai/molmospaces' own main (see
      # sync-upstream.yaml). The G1 merge PR (#2) targets it, and without it
      # listed here `pull_request` never matches that PR's base, so no CI job is
      # created at all -- the only check reported is the GitGuardian app scan,
      # which runs independently of workflow triggers and so goes green without
      # anything having been built.
      - main_public
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Log disk space & memory
        run: |
          df -h /
          free -h || vm_stat || true

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Deleting these took ~85s of every job while nothing waited for the
          # space, so detach it and let it finish during later steps.
          # /opt/hostedtoolcache is deliberately left alone: later steps can read
          # from it, and a background delete would race them.
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost >/dev/null 2>&1 &
          sudo apt-get clean
          # NOTE: reports space before the background delete has finished.
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OSMesa packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/osmesa-debs
          # The .deb set depends on the runner image, so a new image gets a fresh cache.
          key: osmesa-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1

      - name: Install OSMesa dependencies
        if: runner.os == 'Linux'
        # A stalled mirror used to hang this step for hours: apt has no timeout of
        # its own. Cap each network attempt so a stall becomes a retry rather than a
        # hang. The .debs are cached, so the mirror is only hit on a cache miss; the
        # install itself runs offline so a slow download can't eat its time budget.
        timeout-minutes: 10
        run: |
          PKGS="libgl1-mesa-dev libglew-dev libosmesa6-dev"
          DEBS="$HOME/osmesa-debs"
          if ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb; then
            echo "Installed from cached .debs"
            exit 0
          fi
          echo "No usable cached .debs; downloading from the mirror"
          retry() {
            for attempt in 1 2 3; do
              timeout --kill-after=10s 150s "$@" && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "'$*' failed or stalled (attempt ${attempt}/3); retrying in 5s" >&2
                sleep 5
              fi
            done
            echo "::error::'$*' did not succeed after 3 attempts" >&2
            return 1
          }
          retry sudo apt-get update
          # Partial downloads persist in /var/cache/apt/archives, so retries resume.
          retry sudo apt-get install -y --fix-missing --download-only $PKGS
          sudo apt-get install -y --no-download $PKGS
          mkdir -p "$DEBS"
          cp /var/cache/apt/archives/*.deb "$DEBS"/

      - name: Set MuJoCo rendering backend
        if: runner.os == 'Linux'
        run: echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco,g1_humanoid]

      - name: Log disk space
        run: |
          df -h /

      - name: Run component tests
        run: |
          source .venv/bin/activate
          python -m pytest mlspaces_tests/component_tests/ -v --tb=short -x \
            --cov --cov-report=xml

      - name: Upload coverage to Codecov
        # Coverage is informational -- a Codecov outage must not redden an
        # otherwise-green build.
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: component-${{ matrix.os }}
          fail_ci_if_error: false

  data-generation-tests:
    timeout-minutes: 60
    # On private/internal repos, larger runners are available -- use the 8-core XL
    # runner there (these tests are the CI bottleneck and the standard 2-core hosted
    # runner is where we've seen memory pressure). Public repos aren't eligible for
    # larger runners, so they stay on the standard hosted runner.
    # Split across 4 parallel jobs (pytest-split) instead of one long-running job,
    # both for speed and to reduce exposure to mid-run cancellation/timeouts.
    # data_generation tests exercise MjOpenGLRenderer, which requires a headless GL
    # backend -- macOS CI runners can't create an offscreen CGL context (no
    # EGL/OSMesa backend available for macOS in mujoco), so Linux-only.
    strategy:
      fail-fast: true
      matrix:
        group: [1, 2, 3, 4]
        python-version: ["3.12"]

    runs-on: ${{ github.event.repository.private && '8-Core-XL-Runner-Ubuntu-Latest' || 'ubuntu-latest' }}

    steps:
      - name: Log disk space & memory
        run: |
          df -h /
          free -h

      - name: Free disk space (Ubuntu)
        run: |
          # Deleting these took ~85s of every job while nothing waited for the
          # space, so detach it and let it finish during later steps.
          # /opt/hostedtoolcache is deliberately left alone: later steps can read
          # from it, and a background delete would race them.
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost >/dev/null 2>&1 &
          sudo apt-get clean
          # NOTE: reports space before the background delete has finished.
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OSMesa packages
        uses: actions/cache@v4
        with:
          path: ~/osmesa-debs
          # The .deb set depends on the runner image, so a new image gets a fresh cache.
          key: osmesa-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1

      - name: Install OSMesa dependencies
        # A stalled mirror used to hang this step for hours: apt has no timeout of
        # its own. Cap each network attempt so a stall becomes a retry rather than a
        # hang. The .debs are cached, so the mirror is only hit on a cache miss; the
        # install itself runs offline so a slow download can't eat its time budget.
        timeout-minutes: 10
        run: |
          PKGS="libgl1-mesa-dev libglew-dev libosmesa6-dev"
          DEBS="$HOME/osmesa-debs"
          if ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb; then
            echo "Installed from cached .debs"
            exit 0
          fi
          echo "No usable cached .debs; downloading from the mirror"
          retry() {
            for attempt in 1 2 3; do
              timeout --kill-after=10s 150s "$@" && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "'$*' failed or stalled (attempt ${attempt}/3); retrying in 5s" >&2
                sleep 5
              fi
            done
            echo "::error::'$*' did not succeed after 3 attempts" >&2
            return 1
          }
          retry sudo apt-get update
          # Partial downloads persist in /var/cache/apt/archives, so retries resume.
          retry sudo apt-get install -y --fix-missing --download-only $PKGS
          sudo apt-get install -y --no-download $PKGS
          mkdir -p "$DEBS"
          cp /var/cache/apt/archives/*.deb "$DEBS"/

      - name: Install FFmpeg (torchcodec loads it at runtime)
        # ~60 MB of .debs; the Azure mirror has stalled mid-download often enough
        # to fail whole shards, so cache the packages across runs.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ffmpeg
          # Restoring only unpacks files; libblas3's postinst creates the
          # libblas.so.3 alternatives symlink that libavfilter needs.
          execute_install_scripts: true
          version: 2

      - name: Set MuJoCo rendering backend
        run: echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco,g1_humanoid,torch-cpu]

      - name: Run data generation tests (group ${{ matrix.group }}/4)
        run: |
          source .venv/bin/activate
          # Background memory sampler so we can tell OOM apart from a timeout or
          # a cancelled run (e.g. superseded by a newer push in this workflow's
          # concurrency group) after the fact, even if the test process is killed.
          ( while true; do date; free -h; sleep 15; done ) > memory_usage.log &
          MONITOR_PID=$!
          python -m pytest mlspaces_tests/data_generation/ -v --tb=short -x \
            --splits 4 --group ${{ matrix.group }} \
            --cov --cov-report=xml
          TEST_EXIT=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload coverage to Codecov
        # Each of the four split groups uploads its own partial report; Codecov
        # merges them (and the other jobs') into one figure per commit.
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: datagen
          fail_ci_if_error: false

      - name: Diagnose data generation test failure (memory/OOM/cancellation)
        if: always()
        run: |
          echo "=== tail of memory_usage.log ==="
          tail -n 100 memory_usage.log 2>/dev/null || echo "(no memory_usage.log; step may not have started)"
          echo
          echo "=== dmesg: OOM-killer activity ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom' \
            || echo "No OOM-killer messages found in dmesg (exit 143 is likely a cancellation, not OOM)"

  ruff-checks:
    timeout-minutes: 60
    # Job id kept as `ruff-checks` -- required by main's branch protection status
    # checks. Runs the exact same hooks (and pinned tool versions) as
    # `.pre-commit-config.yaml` via `pre-commit/action`, so CI can never drift
    # from what runs locally.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ty-check,pyupgrade
