name: Core CI/CD checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest-m, macos-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Log disk space
        run: |
          df -h /

      - name: Log memory
        run: |
          free -h || vm_stat || true

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSMesa dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglew-dev libosmesa6-dev

      - name: Set MuJoCo rendering backend
        if: runner.os == 'Linux'
        run: echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco]

      - name: Log disk space
        run: |
          df -h /

      - name: Run component tests
        run: |
          source .venv/bin/activate
          python -m pytest mlspaces_tests/component_tests/ -v --tb=short -x

  data-generation-tests:
    # Split across 4 parallel jobs (pytest-split) instead of one long-running job,
    # both for speed and to reduce exposure to mid-run cancellation/timeouts.
    # data_generation tests exercise MjOpenGLRenderer, which requires a headless GL
    # backend -- macOS CI runners can't create an offscreen CGL context (no
    # EGL/OSMesa backend available for macOS in mujoco), so Linux-only.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
        python-version: ["3.11"]

    runs-on: ubuntu-latest

    steps:
      - name: Log disk space
        run: |
          df -h /

      - name: Log memory
        run: |
          free -h

      - name: Free disk space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSMesa dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglew-dev libosmesa6-dev

      - name: Set MuJoCo rendering backend
        run: echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco]

      - name: Run data generation tests (group ${{ matrix.group }}/4)
        run: |
          source .venv/bin/activate
          # Background memory sampler so we can tell OOM apart from a timeout or
          # a cancelled run (e.g. superseded by a newer push in this workflow's
          # concurrency group) after the fact, even if the test process is killed.
          ( while true; do date; free -h; sleep 15; done ) > memory_usage.log &
          MONITOR_PID=$!
          python -m pytest mlspaces_tests/data_generation/ -v --tb=short -x \
            --splits 4 --group ${{ matrix.group }}
          TEST_EXIT=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          exit $TEST_EXIT

      - name: Diagnose data generation test failure (memory/OOM/cancellation)
        if: always()
        run: |
          echo "=== tail of memory_usage.log ==="
          tail -n 100 memory_usage.log 2>/dev/null || echo "(no memory_usage.log; step may not have started)"
          echo
          echo "=== dmesg: OOM-killer activity ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom' \
            || echo "No OOM-killer messages found in dmesg (exit 143 is likely a cancellation, not OOM)"

  ruff-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ruff for formatting and linting
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "--version"

      - name: Run formatting using ruff
        run: |
          ruff format --check .
