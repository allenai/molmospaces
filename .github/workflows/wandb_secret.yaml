name: Check WANDB_API_KEY

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wandb_secret.yaml

jobs:
  check-wandb-key:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WANDB_API_KEY authenticates
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          if [ -z "$WANDB_API_KEY" ]; then
            echo "::error::WANDB_API_KEY secret is not set (or not available to this event, e.g. fork PRs)"
            exit 1
          fi
          resp=$(curl -sS -u "api:${WANDB_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { viewer { username } }"}' \
            https://api.wandb.ai/graphql)
          user=$(echo "$resp" | jq -r '.data.viewer.username // empty')
          if [ -z "$user" ]; then
            echo "::error::WANDB_API_KEY did not authenticate"
            exit 1
          fi
          echo "WANDB_API_KEY is valid (authenticated as $user)"
